packages:
  - "apps/*"
  - "packages/*"
  - "spikes/*" # temporary: removed once Plan 5 ports these checks into event-api tests
allowBuilds:
  "@astryxdesign/core": false # postinstall only prints an `astryx init` hint; the spike works without it
  esbuild: true
  msgpackr-extract: false # optional native accelerator pulled in by bullmq; msgpackr falls back to pure JS
minimumReleaseAgeExclude:
  - eslint@10.12.0
  - "@astryxdesign/build@0.6.5"
  - "@astryxdesign/core@0.6.5"
  - "@astryxdesign/theme-neutral@0.6.5"
