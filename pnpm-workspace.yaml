packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
allowBuilds:
  "@astryxdesign/core": false # postinstall only prints an `astryx init` hint; the spike works without it
  esbuild: true
  msgpackr-extract: false # optional accelerator pulled in by bullmq; false only skips its install/build script (the prebuilt @msgpackr-extract/msgpackr-extract-<platform> binary still loads where available, pure JS otherwise)
# Supply-chain guard: pnpm refuses package versions published less than 8 hours ago (in minutes).
# If an approved plan pins a newer version, wait or add a temporary exact-version entry under
# minimumReleaseAgeExclude, and remove it once the version has aged past the window.
minimumReleaseAge: 480
